<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal Soal Asesmen</title>
    <style>
        /* CSS Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            border: 1px solid #e1e4e8; /* Flat border tanpa shadow tebal */
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .container h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        .container p {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        /* Gaya untuk navigasi tombol flat */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-links a {
            display: block;
            padding: 14px 20px;
            background-color: #2B1B70; /* Warna utama solid (flat) */
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .nav-links a:hover {
            background-color: #3c2a91; /* Sedikit lebih terang saat di-hover */
        }

        .nav-links a:active {
            transform: scale(0.98); /* Efek klik sederhana */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tingkatan</h1>
        <p>Silakan pilih halaman yang ingin diakses:</p>
        
        <div class="nav-links">
            <!-- Ganti href dengan nama file HTML tujuan Anda -->
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/KKA-X.html">Materi Pelajaran</a>
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/INF-X.html">Latihan Soal</a>
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/INF-XI.html">Rekap Penilaian</a>
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/INF-XII.html">Tentang</a>
        </div>
    </div>

</body>
</html>
