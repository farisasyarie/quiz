<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal Asesmen SMAN 3 Kuala Kapuas</title>
    <style>
        /* CSS Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Menggunakan font sistem bawaan agar mirip aplikasi native */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #262626;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            overflow: hidden;
            /* Jika diakses lewat HP, hapus border */
            @media (max-width: 450px) {
                border: none;
                border-radius: 0;
                background-color: #fafafa;
            }
        }

        /* Bagian Profil / Header ala Instagram */
        .profile-header {
            text-align: center;
            padding: 30px 20px 20px;
            background-color: #ffffff;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #efefef;
            border: 1px solid #dbdbdb;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .profile-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 5px;
        }

        .profile-header p {
            font-size: 14px;
            color: #8e8e8e;
        }

        /* Bagian List Menu (IG Settings Style) */
        .nav-links {
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-top: 1px solid #dbdbdb;
            border-bottom: 1px solid #dbdbdb;
        }

        .nav-links a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #262626;
            text-decoration: none;
            font-size: 15px;
            transition: background-color 0.2s ease;
        }

        /* Garis pemisah antar menu */
        .nav-links a:not(:last-child) {
            border-bottom: 1px solid #efefef;
        }

        .nav-links a:hover, 
        .nav-links a:active {
            background-color: #fafafa;
        }

        /* Teks panah kanan */
        .chevron {
            color: #8e8e8e;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="profile-header">
            <!-- Ikon placeholder (bisa diganti tag <img> logo sekolah/profil) -->
            <div class="profile-pic">📝</div>
            <h1>Tingkatan Kelas</h1>
        </div>
        
        <!-- Menu Navigasi -->
        <div class="nav-links">
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/KKA-X.html">
                <span>Koding & KA X</span>
                <span class="chevron">❯</span>
            </a>
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/INF-X.html">
                <span>Informatika X</span>
                <span class="chevron">❯</span>
            </a>
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/INF-XI.html">
                <span>Informatika XI</span>
                <span class="chevron">❯</span>
            </a>
            <a href="http://portfolio.farisasyarie.com/quiz/mapel/INF-XII.html">
                <span>Informatika XII</span>
                <span class="chevron">❯</span>
            </a>
        </div>
    </div>

</body>
</html>
